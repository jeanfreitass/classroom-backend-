openapi: 3.1.1
info:
  title: Minha API
  description: Projeto de API rest em aulas de Back End
  version: 0.1.0
servers:
  - url: http://localhost:3000/
    description: Ambiente de desenvolvimento
tags:
  - tarefas
paths:
  /tarefas:
    get:
      summary: Lista as tarefas
      tags:
      - tarefas
      responses:
        200:
          description: Operação com sucesso
          content:
            aplication/json:
              schema:
                type: array 
                items:
                  $ref: '#/components/schemas/Tarefa'
                
        500:
          description: Erro inesperado
          content:
              aplication/json:
                schema:
                  $ref: '#/components/schemas/Erro'
    post:
      summary: Cria uma tarefa
      tags:
      - tarefas
      requestBody:
        content:
          aplication/json:
                schema:
                  type: object
                  properties:
                    nome: 
                      type: string
                      example: Estudar swagger
      responses:
        201:
          description: Tarefa criada com sucesso
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        422:
          description: Nome é obrigatório
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        500:
          description: Erro inesperado
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /tarefas/id:
    get:
      summary: Obter uma tarefa
      tags:
      - tarefas
      parameters:
      - in: path 
        name: tarefaId
        type: string
        required: true
      responses:
        200:
          description: Tarefa encontrada
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        400:
          description: ID inválido
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Tarefa não encontrada
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        500:
          description: Erro inesperado
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      security:
        - token_jwt: [comitador da main]
      summary: Atualizar uma tarefa existente
      tags:
      - tarefas
      parameters:
      - in: path 
        name: tarefaId
        type: string
        required: true
      requestBody:
        content:
          aplication/json:
            schema:
              type: object 
      responses:
        200:
          description: Tarefa encontrada
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        400:
          description: ID inválido
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Tarefa não encontrada
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        422:
          description: Sintaxe incorreta
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        500:
          description: Erro inesperado
          content:
            aplication/json:
              schema:
               $ref: '#/components/schemas/Erro'
    delete:
      summary: Deleta uma tarefa
      tags:
      - tarefas
      parameters:
      - in: path 
        name: tarefaId
        type: string
        required: true
      responses:
        204:
          description: Tarefa encontrada
          content:
        400:
          description: ID inválido
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Tarefa não encontrada
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        422:
          description: Sintaxe incorreta
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
        500:
          description: Erro inesperado
          content:
            aplication/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  schemas:
    Tarefa:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        concluida:
          type: boolean
    Erro:
      type: object
      properties:
        msg:
          type: string
  securitySchemes: 
    token_jwt: 
      type: http
      scheme: bearer
      in: header

